security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            pattern: ^/(admin|2fa)
            lazy: true
            stateless: false
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin
                username_parameter: email
                password_parameter: password
                failure_path: admin_login
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_check
                default_target_path: admin
            logout:
                path: admin_logout
                target: admin_login
                invalidate_session: true

        main:
            pattern: ^/
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/logout, roles: PUBLIC_ACCESS }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        # Routes API publiques (ordre important : évaluation séquentielle, premier match gagne)
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/users, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/search, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/products, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/product_translations, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/product_categories, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/site_settings, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/carousel_slides, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/cart/validate, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/checkout/session/guest, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/orders/guest/by-stripe-session, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/supports, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/webhooks/stripe, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/verify-email, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/contexts, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        # Tout le reste de l'API exige une authentification complète
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10