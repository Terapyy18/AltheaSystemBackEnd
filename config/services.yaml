parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Service\UserPasswordHasher:
        bind:
            $processor: '@api_platform.doctrine.orm.state.persist_processor'

    App\EventSubscriber\AdminLoginSubscriber:
        arguments:
            $router: '@router'
            $requestStack: '@request_stack'
        tags:
            - { name: kernel.event_subscriber }